/* The page is built against a small reset that Claude supplies around an artifact; here it is spelled out.
   The root is padded by the phone's safe areas, and the bands that leaves (behind the status bar and the home
   indicator) take the dark colour set on html, so the white status-bar text always reads. */
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{background:#111712;overscroll-behavior:none}
body{margin:0;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
@font-face{font-family:'Vollkorn';font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/vollkorn-greek-wght-normal.woff2) format('woff2');unicode-range:U+0370-0377,U+037A-037F,U+0384-038A,U+038C,U+038E-03A1,U+03A3-03FF}

<style>
/* Layout: a one-screen app. Each verse is set over a full-bleed photograph, one per swipe: the picture shows
   in the upper part and is shaded where the words sit. Controls float above it, detail arrives in bottom
   sheets, and in-order reading is a quiet page of its own. The six plain "plot" grounds remain for share
   images and for any card whose picture cannot load. */
:root{
  color-scheme:light;
  --paper:#eef0e6; --surface:#f9faf4; --ink:#18231c; --muted:#566259; --line:#cdd3c4;
  --accent:#84560a; --accent-ink:#fffdf4; --hl:#f1dfa6; --shadow:rgba(10,14,11,.28);
  --scrim:rgba(10,14,11,.5); --chip:rgba(10,14,11,.56); --on-chip:#fbfaf2; --chip-ink:#16201a;
  /* verse grounds (ground / text / seed). Each is a complete surface, the same in both themes. */
  --soil-g:#2b1c14;  --soil-t:#f4eadb;  --soil-d:#dba63c;
  --wheat-g:#e2b340; --wheat-t:#2a1a0c; --wheat-d:#8a5a12;
  --field-g:#1e4a37; --field-t:#f0f1e2; --field-d:#c3d66b;
  --sky-g:#c5dcea;   --sky-t:#13293b;   --sky-d:#f7fbfd;
  --clay-g:#a4472a;  --clay-t:#fff4e8;  --clay-d:#2b1c14;
  --night-g:#161a38; --night-t:#ebe8ff; --night-d:#f0cf66;
  --serif:"Vollkorn",Georgia,"Times New Roman",serif;
  --label:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111712; --surface:#1a221c; --ink:#e8ebdc; --muted:#9ba794; --line:#2e3a31;
    --accent:#e3b448; --accent-ink:#1d1606; --hl:#4d3f12; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111712; --surface:#1a221c; --ink:#e8ebdc; --muted:#9ba794; --line:#2e3a31;
  --accent:#e3b448; --accent-ink:#1d1606; --hl:#4d3f12; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62);
}
.plot-soil{--g:var(--soil-g);--t:var(--soil-t);--d:var(--soil-d)}
.plot-wheat{--g:var(--wheat-g);--t:var(--wheat-t);--d:var(--wheat-d)}
.plot-field{--g:var(--field-g);--t:var(--field-t);--d:var(--field-d)}
.plot-sky{--g:var(--sky-g);--t:var(--sky-t);--d:var(--sky-d)}
.plot-clay{--g:var(--clay-g);--t:var(--clay-t);--d:var(--clay-d)}
.plot-night{--g:var(--night-g);--t:var(--night-t);--d:var(--night-d)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid currentColor;outline-offset:2px}
svg{display:block}
#app{position:relative;height:100%;max-width:480px;margin-inline:auto;overflow:hidden;background:var(--paper)}
@media (min-width:500px){#app{box-shadow:0 0 0 1px var(--line)}}
.view{position:absolute;inset:0}
.view.off{visibility:hidden;pointer-events:none}

/* top bar: floats over the feed, sits solid above the reading page */
.bar{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;pointer-events:none}
.bar>*{pointer-events:auto}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--chip);color:var(--on-chip);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg button{min-height:36px;padding:0 14px;border-radius:999px;font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--on-chip);color:var(--chip-ink)}
.bar-right{display:flex;gap:8px}
.chip{display:grid;place-items:center;min-width:42px;height:42px;padding:0 12px;border-radius:999px;background:var(--chip);color:var(--on-chip);font-family:var(--label);font-weight:600;font-size:15px;letter-spacing:.06em;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chip svg{width:20px;height:20px}
.chip.icon{padding:0}
#app[data-view="read"] .bar{background:var(--paper);pointer-events:auto}
#app[data-view="read"] .seg,#app[data-view="read"] .chip{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
#app[data-view="read"] .seg button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

/* feed */
.feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;outline:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;overflow:hidden;background:var(--g);color:var(--t)}
.seeds{position:absolute;top:0;right:0;width:100%;aspect-ratio:1;max-width:100%;color:var(--d);pointer-events:none}
.card-body{position:relative;display:flex;flex-direction:column;gap:14px;width:100%;min-width:0;padding:74px 24px 16px}
.verse-box{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;cursor:pointer}
.verse{margin:0;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.22;letter-spacing:-.004em;text-wrap:pretty;overflow-wrap:break-word}
.ref{margin:0;display:flex;align-items:baseline;gap:10px;font-family:var(--label);font-weight:600;font-size:15.5px;letter-spacing:.09em;text-transform:uppercase}
.ref-tr{font-weight:500;opacity:.72}
.mark{margin-left:auto;font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px;letter-spacing:0;text-transform:none;opacity:.72}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:60px;padding:8px 2px 7px;border-radius:14px;background:color-mix(in srgb,var(--t) 10%,transparent);font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
.acts svg{width:22px;height:22px}
.acts button[aria-pressed="true"]{background:var(--t);color:var(--g)}
.hint{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--label);font-weight:500;font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hint svg{width:16px;height:16px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
/* picture cards: photo, then a shade that deepens behind the words, then the words */
.card.pic{--t:#fffdf6}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s ease;-webkit-user-select:none;user-select:none;pointer-events:none}
.ph.in{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none}
.card.pic .verse{text-shadow:0 1px 2px rgb(0 0 0/.5),0 0 22px rgb(0 0 0/.42)}
.card.pic .ref,.card.pic .hint,.cap{text-shadow:0 1px 2px rgb(0 0 0/.55)}
.card.pic .acts button{background:rgb(255 255 255/.16)}
.card.pic .acts button[aria-pressed="true"]{background:var(--t);color:var(--g)}
.cap{margin:-3px 0 0;font-family:var(--label);font-weight:500;font-size:12.5px;line-height:1.3;letter-spacing:.035em;opacity:.84;text-wrap:balance}
.hint~.cap{display:none}
/* a picture whose subject sits low carries the words at the top instead */
.card.pic.up .verse-box{flex:0 1 auto;justify-content:flex-start}
.card.pic.up .ref{margin-bottom:auto}

/* reading page */
.reader{display:flex;flex-direction:column;padding-top:62px;background:var(--paper)}
.reader-head{display:flex;align-items:center;gap:10px;padding:6px 16px 10px;border-bottom:1px solid var(--line)}
.pick{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 16px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--label);font-weight:700;font-size:15.5px;letter-spacing:.08em;text-transform:uppercase}
.pick svg{width:16px;height:16px}
.rscroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 130px}
.prev{display:inline-flex;align-items:center;gap:4px;min-height:42px;margin-top:8px;color:var(--muted);font-family:var(--label);font-weight:600;font-size:14.5px;letter-spacing:.07em;text-transform:uppercase}
.prev svg{width:16px;height:16px}
.ch{max-width:34em;margin:0 auto}
.ch-h{margin:26px 0 10px;font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.1;text-wrap:balance}
.sup{margin:0 0 14px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:var(--muted)}
.vv{margin:0;font-family:var(--serif);font-size:19.5px;line-height:1.62}
.v{border-radius:4px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.v sup{margin-right:.3em;font-family:var(--label);font-weight:700;font-size:.6em;line-height:0;vertical-align:.55em;color:var(--accent);font-variant-numeric:tabular-nums}
.v.hl{background:var(--hl)}
.v.sel{background:var(--ink);color:var(--paper)}
.v.sel sup{color:inherit}
.poetry .v{display:block;margin-bottom:.22em;padding-left:1.7em;text-indent:-1.7em}
.more{max-width:34em;margin:28px auto 0;color:var(--muted);font-family:var(--label);font-weight:600;font-size:14.5px;letter-spacing:.07em;text-transform:uppercase}
.more button{margin-left:10px;min-height:40px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:inherit;letter-spacing:inherit;text-transform:inherit}
.selbar{position:absolute;inset:auto 12px 14px 12px;z-index:6;display:flex;align-items:center;gap:6px;padding:7px 7px 7px 16px;border-radius:16px;background:var(--ink);color:var(--paper);box-shadow:0 8px 28px var(--shadow)}
.sel-ref{flex:1;min-width:0;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
.selbar button{min-height:42px;padding:0 13px;border-radius:11px;font-family:var(--label);font-weight:700;font-size:14.5px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.selbar .go{background:var(--paper);color:var(--ink)}
.selbar .x{padding:0 10px}
.selbar .x svg{width:20px;height:20px}

/* sheets */
.scrim{position:absolute;inset:0;z-index:8;background:var(--scrim)}
.sheet{position:absolute;inset:auto 0 0 0;z-index:9;display:flex;flex-direction:column;max-height:88%;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px var(--shadow);transform:translateY(103%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet-top{display:flex;align-items:center;justify-content:flex-end;min-height:46px;padding:6px 8px 0}
.sheet-x{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:var(--muted)}
.sheet-x svg{width:22px;height:22px}
.sheet-body{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 22px}
.eyebrow{margin:0;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.eyebrow .dim{font-weight:500;color:var(--muted)}
.quote{margin:8px 0 0;font-family:var(--serif);font-style:italic;font-size:18.5px;line-height:1.42;text-wrap:pretty}
.lab{margin:20px 0 4px;font-family:var(--label);font-weight:700;font-size:13.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.note{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;text-wrap:pretty}
.fine{margin:16px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.fine.tight{margin-top:6px}
/* older commentators: a row of names, one opened at a time */
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.who button{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--label);font-weight:600;font-size:15.5px;letter-spacing:.04em;white-space:nowrap}
.who button span{font-weight:500;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.who button[aria-expanded="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.who button[aria-expanded="true"] span{color:inherit;opacity:.75}
.cm{margin-top:14px;padding:16px 16px 14px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.cm-name{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2}
.cm-name span{margin-left:6px;font-family:var(--label);font-weight:500;font-size:14.5px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.cm-about{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--muted)}
.cm-on{margin:12px 0 0;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cm-text{margin-top:10px}
.cm-text p{margin:0 0 .8em;font-family:var(--serif);font-size:17.5px;line-height:1.55;text-wrap:pretty;overflow-wrap:break-word}
.cm-text p:last-child{margin-bottom:0}
.cm-text .q{font-style:italic;font-weight:600}
.cm-text .tr{padding-left:12px;border-left:2px solid var(--line);font-style:italic}
.cm-text .gap{font-family:var(--label);font-size:13px;letter-spacing:.06em;color:var(--muted);text-align:center}
.cm-text .trl{display:block;margin:0 0 4px;font-family:var(--label);font-style:normal;font-weight:700;font-size:12.5px;line-height:1.3;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cm-text.clamp{max-height:215px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.cm-more{display:inline-flex;align-items:center;min-height:44px;margin-top:8px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--label);font-weight:700;font-size:14.5px;letter-spacing:.07em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{flex:1 1 130px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--label);font-weight:700;font-size:15.5px;letter-spacing:.07em;text-transform:uppercase}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn svg{width:20px;height:20px}
.preview{display:grid;place-items:center;min-height:190px;padding:10px 0 2px}
.preview img{display:block;max-width:100%;max-height:42vh;width:auto;height:auto;border-radius:10px;box-shadow:0 6px 24px var(--shadow);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.opts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.seg2{display:flex;padding:3px;border-radius:13px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.seg2 button{min-height:40px;padding:0 12px;border-radius:10px;font-family:var(--label);font-weight:600;font-size:14.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.seg2 button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.sw{display:flex;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;background:var(--g);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.sw button[aria-checked="true"]{outline:2px solid var(--ink);outline-offset:2px}
.bgrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;min-height:46px;margin-top:12px}
.bgmore{display:contents}
.mini{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line);font-family:var(--label);font-weight:700;font-size:14.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.mini svg{width:18px;height:18px}
.bgcap{flex:1 0 100%;min-width:0;font-size:13.5px;line-height:1.35;color:var(--muted)}
.copybox{display:block;width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.4;resize:none}
.bk{display:flex;flex-wrap:wrap;gap:8px}
.bk button{min-height:42px;padding:0 13px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--line);font-size:15.5px}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px;margin-top:12px}
.chs button{min-height:48px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--line);font-family:var(--label);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.backbtn{display:inline-flex;align-items:center;gap:4px;min-height:42px;margin:0 0 4px -6px;padding:0 8px;color:var(--muted);font-family:var(--label);font-weight:600;font-size:14.5px;letter-spacing:.07em;text-transform:uppercase}
.backbtn svg{width:16px;height:16px}
.saved{list-style:none;margin:8px 0 0;padding:0}
.saved li{display:flex;align-items:flex-start;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.saved .open{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.saved .r{font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.saved .x{font-family:var(--serif);font-size:17px;line-height:1.36}
.saved .rm{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;color:var(--muted)}
.saved .rm svg{width:18px;height:18px}
.about{margin-top:14px;border-top:1px solid var(--line)}
.install{margin-top:18px;padding:14px 16px 16px;border-radius:14px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.about summary{display:flex;align-items:center;min-height:46px;font-family:var(--label);font-weight:700;font-size:14px;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;list-style:none}
.about summary::-webkit-details-marker{display:none}
.about summary::after{content:"+";margin-left:auto;font-size:20px;font-weight:500;line-height:1}
.about[open] summary::after{content:"–"}
.credits{list-style:none;margin:0;padding:0 0 6px;font-size:14px;line-height:1.4}
.credits li{padding:7px 0;border-top:1px solid var(--line)}
.credits span{display:block;color:var(--muted)}
.toast{position:absolute;left:50%;top:68px;z-index:12;max-width:calc(100% - 40px);padding:11px 18px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:15px;line-height:1.3;text-align:center;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){
  .sheet,.toast,.ph{transition:none}
  .hint svg{animation:none}
}
</style>
</head>
<body>
<div id="app" data-view="feed">

      <button type="button" role="tab" id="tabFeed" aria-selected="true" aria-controls="feed">For you</button>
      <button type="button" role="tab" id="tabRead" aria-selected="false" aria-controls="reader">In order</button>
    </div>
    <div class="bar-right">
      <button type="button" class="chip" id="btnTr">BSB</button>
      <button type="button" class="chip icon" id="btnSaved" aria-label="Saved verses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5h10v15l-5-3.8-5 3.8z"/></svg></button>
    </div>
  </header>

  <main id="feed" class="view feed" tabindex="0" aria-label="Random verse feed"></main>

  <section id="reader" class="view reader off" aria-label="Read in order">
    <div class="reader-head">
      <button type="button" class="pick" id="pick" aria-haspopup="dialog"><span id="pickLabel">Genesis 1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5 12 15l5.5-5.5"/></svg></button>
    </div>
    <div class="rscroll" id="rscroll">
      <button type="button" class="prev" id="prevCh" hidden></button>
      <div id="chapters"></div>
      <p class="more" id="more"></p>
    </div>
  </section>

  <div class="selbar" id="selbar" hidden>
    <span class="sel-ref" id="selRef"></span>
    <button type="button" class="go" data-sel="image">Make image</button>
    <button type="button" data-sel="copy">Copy</button>
    <button type="button" class="x" data-sel="clear" aria-label="Clear selection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden>
    <div class="sheet-top"><button type="button" class="sheet-x" id="sheetClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';
var NAME='Sower';
var STANDALONE=true;   // true in the build that runs as its own app, outside Claude
var P=[{"b":0,"c":1,"v":1,"e":1,"t":{"bsb":"In the beginning God created the heavens and the earth.","kjv":"In the beginning God created the heaven and the earth."},"s":"The first sentence of the Bible. It opens an account of creation told in seven days.","m":"God is named as the maker before anything else is described. Sun, moon and sea were worshipped as gods across the ancient Near East; here they are things God made and set in their places."},{"b":0,"c":1,"v":27,"e":27,"t":{"bsb":"So God created man in His own image; in the image of God He created him; male and female He created them.","kjv":"So God created man in his own image, in the image of God created he him; male and female created he them."},"s":"Day six of the creation account, after the land animals.","m":"Only humans are said to be made in God’s image, and the verse says it of male and female alike. In Egypt and Mesopotamia that language was used of kings; Genesis applies it to every person."},{"b":0,"c":50,"v":20,"e":20,"t":{"bsb":"As for you, what you intended against me for evil, God intended for good, in order to accomplish a day like this—to preserve the lives of many people.","kjv":"But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive."},"s":"Joseph to his brothers after their father Jacob has died. Years earlier they sold him into slavery; he now governs Egypt, and they fear revenge.","m":"Joseph does not excuse what they did. He says God worked through it to keep many people alive in the famine."},{"b":1,"c":14,"v":14,"e":14,"t":{"bsb":"The LORD will fight for you; you need only to be still.","kjv":"The LORD shall fight for you, and ye shall hold your peace."},"s":"Moses to the Israelites at the edge of the sea, with Pharaoh’s chariots closing in behind them.","m":"The people are panicking and blaming Moses for bringing them out of Egypt. He tells them the rescue will be God’s doing, and that night the sea opens."},{"b":1,"c":33,"v":14,"e":14,"t":{"bsb":"And the LORD answered, “My Presence will go with you, and I will give you rest.”","kjv":"And he said, My presence shall go with thee, and I will give thee rest."},"s":"God to Moses at Mount Sinai, after the people worshipped the golden calf. Moses has asked who will go with him as he leads them on.","m":"Moses answers that if God’s presence does not go with them, he would rather not leave at all. For him the presence matters more than the destination."},{"b":3,"c":6,"v":24,"e":26,"t":{"bsb":"May the LORD bless you and keep you; may the LORD cause His face to shine upon you and be gracious to you; may the LORD lift up His countenance toward you and give you peace.","kjv":"The LORD bless thee, and keep thee: The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace."},"s":"The words God gives Moses for Aaron and his sons, the priests, to speak over Israel.","m":"Known as the priestly blessing, it is still spoken in synagogues and churches. Two small silver scrolls inscribed with a form of it, found at Ketef Hinnom in Jerusalem, are the oldest known inscriptions of a biblical text."},{"b":4,"c":6,"v":4,"e":5,"t":{"bsb":"Hear, O Israel: The LORD our God, the LORD is One. And you shall love the LORD your God with all your heart and with all your soul and with all your strength.","kjv":"Hear, O Israel: The LORD our God is one LORD: And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might."},"s":"Moses to Israel on the plains of Moab, shortly before they cross into the land.","m":"Called the Shema, from its first Hebrew word, “hear.” Observant Jews recite it morning and evening, and Jesus named verse 5 the greatest commandment."},{"b":4,"c":31,"v":6,"e":6,"t":{"bsb":"Be strong and courageous; do not be afraid or terrified of them, for it is the LORD your God who goes with you; He will never leave you nor forsake you.","kjv":"Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee."},"s":"Moses, aged 120, handing leadership to Joshua. He will not cross the Jordan with the people.","m":"The encouragement is spoken to all Israel as they face nations stronger than themselves. Hebrews 13:5 later quotes the promise that God will never leave or forsake his people."},{"b":5,"c":1,"v":9,"e":9,"t":{"bsb":"Have I not commanded you to be strong and courageous? Do not be afraid; do not be discouraged, for the LORD your God is with you wherever you go.","kjv":"Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest."},"s":"God to Joshua just after Moses’ death, as Joshua takes command and prepares to cross the Jordan.","m":"The command to be strong and courageous comes three times in this short speech. The reason given here is God’s presence wherever Joshua goes; his own ability is never mentioned."},{"b":5,"c":24,"v":15,"e":15,"t":{"bsb":"But if it is unpleasing in your sight to serve the LORD, then choose for yourselves this day whom you will serve, whether the gods your fathers served beyond the Euphrates, or the gods of the Amorites in whose land you are living. As for me and my house, we will serve the LORD!","kjv":"And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD."},"s":"Joshua, near the end of his life, to the tribes of Israel gathered at Shechem.","m":"He has just retold their history from Abraham to the conquest. Then he sets out the choice: the gods their ancestors served, the gods of the land they now live in, or the LORD."},{"b":7,"c":1,"v":16,"e":16,"t":{"bsb":"But Ruth replied: “Do not urge me to leave you or to turn from following you. For wherever you go, I will go, and wherever you live, I will live; your people will be my people, and your God will be my God.”","kjv":"And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God…"},"s":"Ruth, a young widow from Moab, to her mother-in-law Naomi on the road back to Bethlehem. Naomi has urged her to turn back.","m":"Often read at weddings, the words were first spoken by one widow to another. Ruth leaves her country and its gods for Naomi’s, and she becomes the great-grandmother of King David."},{"b":8,"c":16,"v":7,"e":7,"t":{"bsb":"But the LORD said to Samuel, “Do not consider his appearance or height, for I have rejected him; the LORD does not see as man does. For man sees the outward appearance, but the LORD sees the heart.”","kjv":"But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart."},"s":"God to the prophet Samuel in Bethlehem, where he has been sent to anoint one of Jesse’s sons as king.","m":"Samuel assumes the impressive eldest son, Eliab, must be the one. Seven brothers are passed over before David, the youngest, is called in from tending the sheep."},{"b":8,"c":17,"v":47,"e":47,"t":{"bsb":"And all those assembled here will know that it is not by sword or spear that the LORD saves; for the battle is the LORD’s, and He will give all of you into our hands.","kjv":"And all this assembly shall know that the LORD saveth not with sword and spear: for the battle is the LORD’s, and he will give you into our hands."},"s":"David, still a youth, to the Philistine champion Goliath in the Valley of Elah.","m":"He has turned down King Saul’s armour and carries a sling and five stones. His speech says the outcome will show both armies that victory does not depend on weapons."},{"b":13,"c":7,"v":14,"e":14,"t":{"bsb":"…and if My people who are called by My name humble themselves and pray and seek My face and turn from their wicked ways, then I will hear from heaven, forgive their sin, and heal their land.","kjv":"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land."},"s":"God to King Solomon at night, after the dedication of the temple in Jerusalem.","m":"It answers Solomon’s prayer in the previous chapter, which asked God to hear when Israel turned back after drought, locusts or plague. “My people” here is Israel, and the land is theirs."},{"b":15,"c":8,"v":10,"e":10,"t":{"bsb":"Then Nehemiah told them, “Go and eat what is rich, drink what is sweet, and send out portions to those who have nothing prepared, since today is holy to our Lord. Do not grieve, for the joy of the LORD is your strength.”","kjv":"Then he said unto them, Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the LORD is your strength."},"s":"The crowd in Jerusalem is weeping as Ezra reads the Law aloud. The Hebrew says only “he said”; the Berean translation names the speaker as Nehemiah, the governor.","m":"The leaders tell them to stop mourning because the day is holy. They are sent home to feast and to share food with anyone who has none."},{"b":16,"c":4,"v":14,"e":14,"t":{"bsb":"For if you remain silent at this time, relief and deliverance for the Jews will arise from another place, but you and your father’s house will perish. And who knows if perhaps you have come to the kingdom for such a time as this?","kjv":"For if thou altogether holdest thy peace at this time, then shall there enlargement and deliverance arise to the Jews from another place; but thou and thy father’s house shall be destroyed: and who knoweth whether thou art come to the kingdom for such a time as this?"},"s":"Mordecai’s message to his cousin Queen Esther, after a royal decree orders the killing of the Jews across the Persian empire.","m":"Going to the king uninvited could cost Esther her life. The book of Esther never mentions God by name, and this verse is the closest it comes to pointing at providence."},{"b":17,"c":19,"v":25,"e":25,"t":{"bsb":"But I know that my Redeemer lives, and in the end He will stand upon the earth.","kjv":"For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth…"},"s":"Job, answering his friend Bildad. He has lost his children, his wealth and his health, and his friends insist he must have sinned.","m":"In the middle of his complaint Job declares that someone will take up his cause. “Redeemer” translates the Hebrew go’el, the relative whose duty was to defend a family member’s rights."},{"b":18,"c":1,"v":1,"e":2,"t":{"bsb":"Blessed is the man who does not walk in the counsel of the wicked, or set foot on the path of sinners, or sit in the seat of mockers. But his delight is in the Law of the LORD, and on His law he meditates day and night.","kjv":"Blessed is the man that walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful. But his delight is in the law of the LORD; and in his law doth he meditate day and night."},"s":"The opening of the book of Psalms. It has no title and no named author.","m":"It stands as a doorway to the whole collection, contrasting two ways to live. Verse 1 traces a slow settling in: walking alongside, standing on the path, then taking a seat."},{"b":18,"c":16,"v":11,"e":11,"t":{"bsb":"You have made known to me the path of life; You will fill me with joy in Your presence, with eternal pleasures at Your right hand.","kjv":"Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore."},"s":"A psalm of David, a prayer of trust in God as his refuge.","m":"Peter quotes this psalm at Pentecost in Acts 2. He argues that David’s words about not being abandoned to the grave look ahead to the resurrection of Jesus."},{"b":18,"c":19,"v":1,"e":1,"t":{"bsb":"The heavens declare the glory of God; the skies proclaim the work of His hands.","kjv":"The heavens declare the glory of God; and the firmament sheweth his handywork."},"s":"A psalm of David.","m":"The first half says the sky declares God’s glory day and night; the second half turns to the written law. C. S. Lewis ranked it the finest poem in the Psalms."},{"b":18,"c":23,"v":4,"e":4,"t":{"bsb":"Even though I walk through the valley of the shadow of death, I will fear no evil, for You are with me; Your rod and Your staff, they comfort me.","kjv":"Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me; thy rod and thy staff they comfort me."},"s":"A psalm of David, who was a shepherd before he was king.","m":"Up to this verse David speaks about God as “he.” In the dark valley he turns and addresses God directly. The rod was the shepherd’s club against predators, and the staff guided the sheep."},{"b":18,"c":27,"v":1,"e":1,"t":{"bsb":"The LORD is my light and my salvation—whom shall I fear? The LORD is the stronghold of my life—whom shall I dread?","kjv":"The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?"},"s":"A psalm of David, written with enemies in view. Later verses mention armies and false witnesses.","m":"The confidence comes first, and the plea for help only arrives in verse 7. Light, salvation and stronghold (“strength” in the King James Version) are three pictures of the same protection."},{"b":18,"c":30,"v":5,"e":5,"t":{"bsb":"For His anger is fleeting, but His favor lasts a lifetime. Weeping may stay the night, but joy comes in the morning.","kjv":"For his anger endureth but a moment; in his favour is life: weeping may endure for a night, but joy cometh in the morning."},"s":"A psalm of David. Its title links it to the dedication of “the house,” which most modern translations take to be the temple.","m":"David looks back on a time he came close to death and was restored. The verse sets a moment of anger against God’s favor, and a night of weeping against a morning of joy."},{"b":18,"c":34,"v":18,"e":18,"t":{"bsb":"The LORD is near to the brokenhearted; He saves the contrite in spirit.","kjv":"The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit."},"s":"The title ties this psalm to the time David pretended to be insane to escape a Philistine king.","m":"The promise is God’s nearness to people who are already crushed. The next verse admits that the righteous have many troubles."},{"b":18,"c":37,"v":4,"e":4,"t":{"bsb":"Delight yourself in the LORD, and He will give you the desires of your heart.","kjv":"Delight thyself also in the LORD; and he shall give thee the desires of thine heart."},"s":"A wisdom psalm of David, written in old age for people troubled that the wicked seem to prosper.","m":"It opens by telling the reader not to fret over evildoers. This line assumes a person whose joy is already in God, which shapes what that heart wants."},{"b":18,"c":46,"v":1,"e":1,"t":{"bsb":"God is our refuge and strength, an ever-present help in times of trouble.","kjv":"God is our refuge and strength, a very present help in trouble."},"s":"A song of the sons of Korah, a guild of temple musicians.","m":"The psalm pictures mountains falling into the sea and nations in uproar, and says God’s city will not be moved. It inspired Martin Luther’s hymn “A Mighty Fortress Is Our God.”"},{"b":18,"c":46,"v":10,"e":10,"t":{"bsb":"Be still and know that I am God; I will be exalted among the nations, I will be exalted over the earth.","kjv":"Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth."},"s":"Near the end of Psalm 46, a song of the sons of Korah, where God himself speaks.","m":"In context this is most likely a command to warring nations. The verse before says God breaks the bow and shatters the spear, so “be still” is closer to “stop fighting” than to an invitation to quiet."},{"b":18,"c":51,"v":10,"e":10,"t":{"bsb":"Create in me a clean heart, O God, and renew a right spirit within me.","kjv":"Create in me a clean heart, O God; and renew a right spirit within me."},"s":"David’s prayer of confession after the prophet Nathan confronted him over Bathsheba and the death of her husband Uriah.","m":"“Create” is the verb used in Genesis 1:1, one the Old Testament uses only with God as its subject. David is asking for something he cannot produce himself."},{"b":18,"c":56,"v":3,"e":3,"t":{"bsb":"When I am afraid, I put my trust in You.","kjv":"What time I am afraid, I will trust in thee."},"s":"The title places this psalm when the Philistines seized David in Gath.","m":"David does not claim to be unafraid. He names the fear, says where he will put his trust, and in the very next verse says he will not be afraid."},{"b":18,"c":90,"v":12,"e":12,"t":{"bsb":"So teach us to number our days, that we may present a heart of wisdom.","kjv":"So teach us to number our days, that we may apply our hearts unto wisdom."},"s":"The only psalm attributed to Moses.","m":"It sets God’s eternity against the shortness of human life, seventy years, or eighty for the strong. Counting our days is the lesson Moses asks God to teach."},{"b":18,"c":103,"v":11,"e":12,"t":{"bsb":"For as high as the heavens are above the earth, so great is His loving devotion for those who fear Him. As far as the east is from the west, so far has He removed our transgressions from us.","kjv":"For as the heaven is high above the earth, so great is his mercy toward them that fear him. As far as the east is from the west, so far hath he removed our transgressions from us."},"s":"A psalm of David, a hymn that lists what God has done for him.","m":"Two measurements describe forgiveness: the height of the sky and the distance from east to west. The reason follows shortly after: God knows how we are formed and remembers that we are dust."},{"b":18,"c":118,"v":24,"e":24,"t":{"bsb":"This is the day that the LORD has made; we will rejoice and be glad in it.","kjv":"This is the day which the LORD hath made; we will rejoice and be glad in it."},"s":"The last of the Hallel psalms (113–118), sung at Passover.","m":"“The day” follows from verse 22, where the stone the builders rejected becomes the cornerstone. The crowd is celebrating a rescue God has just carried out."},{"b":18,"c":119,"v":105,"e":105,"t":{"bsb":"Your word is a lamp to my feet and a light to my path.","kjv":"Thy word is a lamp unto my feet, and a light unto my path."},"s":"From the longest chapter in the Bible, 176 verses arranged by the 22 letters of the Hebrew alphabet.","m":"Nearly every verse uses a word for Scripture: law, statutes, precepts, word. The lamp in view is a small oil lamp, enough light for the next few steps."},{"b":18,"c":121,"v":1,"e":2,"t":{"bsb":"I lift up my eyes to the hills. From where does my help come? My help comes from the LORD, the Maker of heaven and earth.","kjv":"I will lift up mine eyes unto the hills, from whence cometh my help. My help cometh from the LORD, which made heaven and earth."},"s":"A Song of Ascents (“degrees” in the King James Version), one of fifteen psalms (120–134) traditionally sung by pilgrims on the way up to Jerusalem.","m":"The hills may be the dangerous road ahead or the heights where Jerusalem stands. Either way verse 2 settles it: help comes from the one who made them."},{"b":18,"c":139,"v":13,"e":14,"t":{"bsb":"For You formed my inmost being; You knit me together in my mother’s womb. I praise You, for I am fearfully and wonderfully made. Marvelous are Your works, and I know this very well.","kjv":"For thou hast possessed my reins: thou hast covered me in my mother’s womb. I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well."},"s":"A psalm of David about being completely known by God.","m":"Earlier verses say there is nowhere David could go to escape God’s presence. Here he traces that knowledge back to before his birth, and his response is praise."},{"b":19,"c":3,"v":5,"e":6,"t":{"bsb":"Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.","kjv":"Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths."},"s":"A father’s instruction to his son, from the opening section of Proverbs, a book attributed mainly to Solomon.","m":"“Heart” in Hebrew covers thinking and deciding as well as feeling. In Hebrew the picture in verse 6 is of a road made straight and level for travel."},{"b":19,"c":4,"v":23,"e":23,"t":{"bsb":"Guard your heart with all diligence, for from it flow springs of life.","kjv":"Keep thy heart with all diligence; for out of it are the issues of life."},"s":"A father urging his son to hold on to wisdom.","m":"In Hebrew thought the heart is the control centre, where mind, will and feeling meet. The next verses work outward from it to the mouth, the eyes and the feet."},{"b":19,"c":15,"v":1,"e":1,"t":{"bsb":"A gentle answer turns away wrath, but a harsh word stirs up anger.","kjv":"A soft answer turneth away wrath: but grievous words stir up anger."},"s":"One of the two-line sayings that fill Proverbs 10–22, headed “the proverbs of Solomon.”","m":"The two lines set one kind of speech against another. Proverbs keeps returning to the tongue; three verses later a soothing tongue is called a tree of life."},{"b":19,"c":16,"v":9,"e":9,"t":{"bsb":"A man’s heart plans his course, but the LORD determines his steps.","kjv":"A man’s heart deviseth his way: but the LORD directeth his steps."},"s":"From the central collection of Solomon’s sayings. Chapter 16 gathers several about God’s rule over human plans.","m":"Planning is taken for granted, and nothing here discourages it. The saying is about who has the final word over where the steps land."},{"b":19,"c":17,"v":17,"e":17,"t":{"bsb":"A friend loves at all times, and a brother is born for adversity.","kjv":"A friend loveth at all times, and a brother is born for adversity."},"s":"A saying from Solomon’s collection, in a chapter with several lines on friends and family quarrels.","m":"The two lines build on each other: a friend’s love is constant, and hard times show what a brother is for. Proverbs 18:24 adds that some friends stay closer than a brother."},{"b":19,"c":22,"v":6,"e":6,"t":{"bsb":"Train up a child in the way he should go, and when he is old he will not depart from it.","kjv":"Train up a child in the way he should go: and when he is old, he will not depart from it."},"s":"A saying from the collection attributed to Solomon.","m":"Proverbs describe how life usually goes; they are not guarantees. The Hebrew reads literally “according to his way,” which some take as the right path and others as the child’s own bent."},{"b":19,"c":27,"v":17,"e":17,"t":{"bsb":"As iron sharpens iron, so one man sharpens another.","kjv":"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend."},"s":"From the sayings of Solomon copied out by the men of King Hezekiah (Proverbs 25–29).","m":"Sharpening iron takes friction and throws sparks. The proverb treats honest challenge between friends as the thing that makes each of them more useful."},{"b":20,"c":3,"v":1,"e":1,"t":{"bsb":"To everything there is a season, and a time for every purpose under heaven…","kjv":"To every thing there is a season, and a time to every purpose under the heaven…"},"s":"The Teacher (“the Preacher” in the King James Version), introduced as a son of David and king in Jerusalem, reflecting on life “under the sun.”","m":"This line introduces a poem of fourteen pairs, among them birth and death, planting and uprooting, war and peace. His conclusion in verse 11 is that God has made everything beautiful in its time and set eternity in the human heart (the King James Version has “the world”)."},{"b":20,"c":4,"v":9,"e":10,"t":{"bsb":"Two are better than one, because they have a good return for their labor. For if one falls down, his companion can lift him up; but pity the one who falls without another to help him up!","kjv":"Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow: but woe to him that is alone when he falleth; for he hath not another to help him up."},"s":"The Teacher (“the Preacher” in the King James Version), after describing a man who works without end and has no one to share it with.","m":"The argument is practical. Partners earn more, lift each other up, keep each other warm and can defend themselves, and it ends with the cord of three strands that is not quickly broken."},{"b":20,"c":12,"v":13,"e":13,"t":{"bsb":"When all has been heard, the conclusion of the matter is this: Fear God and keep His commandments, because this is the whole duty of man.","kjv":"Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this is the whole duty of man."},"s":"The next-to-last verse of Ecclesiastes.","m":"For twelve chapters the Teacher (“the Preacher” in the King James Version) has tested wealth, pleasure, work and wisdom and found each one empty. The book then gives its verdict in a single sentence."},{"b":21,"c":8,"v":7,"e":7,"t":{"bsb":"Mighty waters cannot quench love; rivers cannot sweep it away. If a man were to give all the wealth of his house for love, his offer would be utterly scorned.","kjv":"Many waters cannot quench love, neither can the floods drown it: if a man would give all the substance of his house for love, it would utterly be contemned."},"s":"Near the end of the Song of Solomon, a cycle of love poems sung between a bride and her beloved.","m":"The verse before calls love as strong as death. Here it is also beyond price: a man who tried to buy it with everything he owned would be laughed at."},{"b":22,"c":6,"v":8,"e":8,"t":{"bsb":"Then I heard the voice of the Lord saying: “Whom shall I send? Who will go for Us?” And I said: “Here am I. Send me!”","kjv":"Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me."},"s":"Isaiah’s vision of God enthroned in the temple, “in the year that King Uzziah died.”","m":"Moments earlier Isaiah cried out that he was ruined, a man of unclean lips, and a seraph touched his mouth with a burning coal. He volunteers only after he has been cleansed."},{"b":22,"c":9,"v":6,"e":6,"t":{"bsb":"For unto us a child is born, unto us a son is given, and the government will be upon His shoulders. And He will be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.","kjv":"For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace."},"s":"Isaiah to the kingdom of Judah under the threat of Assyria, promising light for a people walking in darkness.","m":"The child is given a string of royal titles, four pairs in most modern translations and five names in the King James Version, which separates “Wonderful” from “Counsellor.” Matthew quotes the opening of this passage when Jesus begins preaching in Galilee, and Handel set this verse in his oratorio Messiah."},{"b":22,"c":26,"v":3,"e":3,"t":{"bsb":"You will keep in perfect peace the steadfast of mind, because he trusts in You.","kjv":"Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee."},"s":"A song that Isaiah says will be sung in Judah on the day God rescues his people.","m":"“Perfect peace” is the Hebrew word shalom said twice. The next verse gives the ground for the trust: in the LORD is everlasting strength, literally an everlasting rock."},{"b":22,"c":40,"v":8,"e":8,"t":{"bsb":"The grass withers and the flowers fall, but the word of our God stands forever.","kjv":"The grass withereth, the flower fadeth: but the word of our God shall stand for ever."},"s":"The start of Isaiah’s message of comfort, addressed to a people in exile in Babylon.","m":"A voice says all humanity is like grass that withers when God’s breath blows on it. Against that the prophet sets the one thing that lasts. Peter quotes these lines in 1 Peter 1:24–25."},{"b":22,"c":40,"v":31,"e":31,"t":{"bsb":"But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.","kjv":"But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint."},"s":"The close of Isaiah 40, answering exiles who say God has lost sight of them.","m":"The verse before says even young men grow tired and fall. The order may surprise: soaring first, then running, and last of all walking without giving up."},{"b":22,"c":41,"v":10,"e":10,"t":{"bsb":"Do not fear, for I am with you; do not be afraid, for I am your God. I will strengthen you; I will surely help you; I will uphold you with My right hand of righteousness.","kjv":"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."},"s":"God speaking to Israel, whom he calls “my servant” and “descendant of Abraham my friend,” while the nations tremble at a rising conqueror.","m":"The command not to fear rests on two statements: I am with you, I am your God. Three promises follow, to strengthen, to help and to uphold."},{"b":22,"c":43,"v":2,"e":2,"t":{"bsb":"When you pass through the waters, I will be with you; and when you go through the rivers, they will not overwhelm you. When you walk through the fire, you will not be scorched; the flames will not set you ablaze.","kjv":"When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee."},"s":"God to exiled Israel, just after telling them he has called them by name and they are his.","m":"The verse says “when,” so the water and the fire are assumed. The images recall the crossing of the sea and the Jordan in Israel’s own history."},{"b":22,"c":53,"v":5,"e":5,"t":{"bsb":"But He was pierced for our transgressions, He was crushed for our iniquities; the punishment that brought us peace was upon Him, and by His stripes we are healed.","kjv":"But he was wounded for our transgressions, he was bruised for our iniquities: the chastisement of our peace was upon him; and with his stripes we are healed."},"s":"The fourth of Isaiah’s Servant Songs, about a servant who suffers for the wrongs of others.","m":"The New Testament reads this chapter as a description of the death of Jesus. Philip explains it that way to an Ethiopian official in Acts 8, and Peter quotes it in 1 Peter 2:24."},{"b":22,"c":55,"v":8,"e":9,"t":{"bsb":"“For My thoughts are not your thoughts, neither are your ways My ways,” declares the LORD. “For as the heavens are higher than the earth, so My ways are higher than your ways and My thoughts than your thoughts.”","kjv":"For my thoughts are not your thoughts, neither are your ways my ways, saith the LORD. For as the heavens are higher than the earth, so are my ways higher than your ways, and my thoughts than your thoughts."},"s":"An invitation, late in Isaiah, to come back to God and be freely pardoned.","m":"The verse before promises that God will abundantly forgive anyone who returns. Read with that verse, the higher thought is mercy on a scale people would not offer."},{"b":23,"c":17,"v":7,"e":8,"t":{"bsb":"But blessed is the man who trusts in the LORD, whose confidence is in Him. He is like a tree planted by the waters that sends out its roots toward the stream. It does not fear when the heat comes, and its leaves are always green. It does not worry in a year of drought, nor does it cease to produce fruit.","kjv":"Blessed is the man that trusteth in the LORD, and whose hope the LORD is. For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit."},"s":"Jeremiah to Judah in its last decades, contrasting two kinds of people.","m":"Just before this, the person who trusts in human strength is a shrub in the desert. The tree by the stream still faces heat and drought, and its roots make the difference. The same image opens Psalm 1."},{"b":23,"c":29,"v":11,"e":11,"t":{"bsb":"For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.","kjv":"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end."},"s":"From a letter Jeremiah sent to the Jews deported to Babylon.","m":"The verse before says the rescue will come after seventy years, so most who first heard it would not live to see it. Meanwhile they are told to build houses, plant gardens and seek the good of the city. The Hebrew word is shalom, peace or wellbeing: “peace” in the King James Version, “prosper” in the Berean Standard Bible."},{"b":24,"c":3,"v":22,"e":23,"t":{"bsb":"Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!","kjv":"It is of the LORD’s mercies that we are not consumed, because his compassions fail not. They are new every morning: great is thy faithfulness."},"s":"A poem of grief over Jerusalem, destroyed by the Babylonians in 586 BC.","m":"These lines stand near the centre of the book, surrounded by scenes of siege and starvation. The hymn “Great Is Thy Faithfulness” takes its title from verse 23."},{"b":25,"c":36,"v":26,"e":26,"t":{"bsb":"I will give you a new heart and put a new spirit within you; I will remove your heart of stone and give you a heart of flesh.","kjv":"A new heart also will I give you, and a new spirit will I put within you: and I will take away the stony heart out of your flesh, and I will give you an heart of flesh."},"s":"God, through Ezekiel, to the exiles in Babylon, promising to bring them home.","m":"The promise goes further than a return to the land. God says he will change the people from within, and verse 22 says he acts for the sake of his own name."},{"b":26,"c":3,"v":17,"e":18,"t":{"bsb":"If the God whom we serve exists, then He is able to deliver us from the blazing fiery furnace and from your hand, O king. But even if He does not, let it be known to you, O king, that we will not serve your gods or worship the golden statue you have set up.","kjv":"If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king. But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up."},"s":"Shadrach, Meshach and Abednego to King Nebuchadnezzar, who has ordered them to bow to his gold statue or be thrown into a furnace.","m":"They say God is able to rescue them, and that even if he does not they will not bow. The two translations word verse 17 differently because the Aramaic is difficult."},{"b":27,"c":6,"v":6,"e":6,"t":{"bsb":"For I desire mercy, not sacrifice, and the knowledge of God rather than burnt offerings.","kjv":"For I desired mercy, and not sacrifice; and the knowledge of God more than burnt offerings."},"s":"God, through the prophet Hosea, to the northern kingdom of Israel in its final decades.","m":"The people kept up their sacrifices while their loyalty vanished like morning mist. Jesus quotes this verse twice in Matthew, both times answering Pharisees who objected to what he and his disciples were doing."},{"b":28,"c":2,"v":13,"e":13,"t":{"bsb":"So rend your hearts and not your garments, and return to the LORD your God. For He is gracious and compassionate, slow to anger, abounding in loving devotion. And He relents from sending disaster.","kjv":"And rend your heart, and not your garments, and turn unto the LORD your God: for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil."},"s":"Joel to Judah after a devastating plague of locusts.","m":"Tearing one’s clothes was the outward sign of grief. Joel asks for the inward reality and quotes God’s own description of himself from Exodus 34: gracious, compassionate, slow to anger."},{"b":29,"c":5,"v":24,"e":24,"t":{"bsb":"But let justice roll on like a river, and righteousness like an ever-flowing stream.","kjv":"But let judgment run down as waters, and righteousness as a mighty stream."},"s":"Amos, a herdsman from Judah, preaching to the prosperous northern kingdom of Israel.","m":"Just before this God says he hates their festivals and will not listen to their songs, because the poor are being cheated in court. Martin Luther King Jr. quoted this line in his “I Have a Dream” speech."},{"b":32,"c":6,"v":8,"e":8,"t":{"bsb":"He has shown you, O man, what is good. And what does the LORD require of you but to act justly, to love mercy, and to walk humbly with your God?","kjv":"He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?"},"s":"Micah, a prophet from the Judean countryside, in a scene set up as a lawsuit between God and his people.","m":"The people ask what offering would satisfy God: calves, thousands of rams, even a firstborn child. The answer is three plain things they have already been told."},{"b":33,"c":1,"v":7,"e":7,"t":{"bsb":"The LORD is good, a stronghold in the day of distress; He cares for those who trust in Him.","kjv":"The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him."},"s":"Nahum’s prophecy against Nineveh, capital of the Assyrian empire that had terrorised Israel and Judah.","m":"This gentle line sits inside a fierce description of God’s power over storm, sea and mountain. For Assyria’s victims, judgment on Nineveh and refuge for the trusting were the same news."},{"b":34,"c":3,"v":17,"e":18,"t":{"bsb":"Though the fig tree does not bud and no fruit is on the vines, though the olive crop fails and the fields produce no food, though the sheep are cut off from the fold and no cattle are in the stalls, yet I will exult in the LORD; I will rejoice in the God of my salvation!","kjv":"Although the fig tree shall not blossom, neither shall fruit be in the vines; the labour of the olive shall fail, and the fields shall yield no meat; the flock shall be cut off from the fold, and there shall be no herd in the stalls: Yet I will rejoice in the LORD, I will joy in the God of my salvation."},"s":"The end of Habakkuk’s prayer. He has been told that Babylon is coming to invade Judah.","m":"For a farming people the list describes total ruin: no fruit, no grain, no flocks. Habakkuk opened the book asking God “How long?” and closes it rejoicing before anything has changed."},{"b":35,"c":3,"v":17,"e":17,"t":{"bsb":"The LORD your God is among you; He is mighty to save. He will rejoice over you with gladness; He will quiet you with His love; He will rejoice over you with singing.","kjv":"The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing."},"s":"The close of Zephaniah, after chapters of warning to Jerusalem in the reign of King Josiah.","m":"A book that opens with judgment ends with God singing. The picture is of a warrior who has won and now rejoices over the people he saved."},{"b":37,"c":4,"v":6,"e":6,"t":{"bsb":"So he said to me, “This is the word of the LORD to Zerubbabel: Not by might nor by power, but by My Spirit, says the LORD of Hosts.”","kjv":"Then he answered and spake unto me, saying, This is the word of the LORD unto Zerubbabel, saying, Not by might, nor by power, but by my spirit, saith the LORD of hosts."},"s":"A message for Zerubbabel, governor of Judah, who is rebuilding the temple after the return from Babylon.","m":"The work had stalled for years, and the returned community was small and poor. The next verse promises that the mountain in his way will become level ground and that he will set the final stone."},{"b":39,"c":5,"v":16,"e":16,"t":{"bsb":"In the same way, let your light shine before men, that they may see your good deeds and glorify your Father in heaven.","kjv":"Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."},"s":"Jesus in the Sermon on the Mount, speaking to his disciples on a hillside in Galilee.","m":"He has just called them the light of the world, a city on a hill, a lamp on a stand. The aim of being seen is that God gets the credit, and in the next chapter he warns against doing good in order to be admired."},{"b":39,"c":5,"v":44,"e":45,"t":{"bsb":"But I tell you, love your enemies and pray for those who persecute you, that you may be sons of your Father in heaven. He causes His sun to rise on the evil and the good, and sends rain on the righteous and the unrighteous.","kjv":"But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you; That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust."},"s":"Jesus in the Sermon on the Mount, in a series of sayings that begin “You have heard that it was said.”","m":"His hearers lived under Roman rule, so “enemies” was no abstraction. The reason he gives is the Father’s own practice of sending sun and rain on good and bad alike."},{"b":39,"c":6,"v":33,"e":33,"t":{"bsb":"But seek first the kingdom of God and His righteousness, and all these things will be added unto you.","kjv":"But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you."},"s":"Jesus in the Sermon on the Mount, speaking to people anxious about food and clothing.","m":"“These things” are the basics he has just listed: what to eat, drink and wear. He points to the birds and the wildflowers as evidence that God knows what they need."},{"b":39,"c":6,"v":34,"e":34,"t":{"bsb":"Therefore do not worry about tomorrow, for tomorrow will worry about itself. Today has enough trouble of its own.","kjv":"Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof."},"s":"The last line of Jesus’ teaching on worry in the Sermon on the Mount.","m":"It follows the instruction to seek God’s kingdom first. Jesus is realistic here. He assumes each day will bring trouble and tells his hearers to carry one day’s worth at a time."},{"b":39,"c":7,"v":7,"e":7,"t":{"bsb":"Ask, and it will be given to you; seek, and you will find; knock, and the door will be opened to you.","kjv":"Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you…"},"s":"Jesus near the end of the Sermon on the Mount.","m":"The three verbs are in a form that can mean keep asking, keep seeking, keep knocking. He follows with a comparison: if flawed parents give their children bread and fish, how much more will the Father give good things."},{"b":39,"c":11,"v":28,"e":30,"t":{"bsb":"Come to Me, all you who are weary and burdened, and I will give you rest. Take My yoke upon you and learn from Me; for I am gentle and humble in heart, and you will find rest for your souls. For My yoke is easy and My burden is light.","kjv":"Come unto me, all ye that labour and are heavy laden, and I will give you rest. Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls. For my yoke is easy, and my burden is light."},"s":"Jesus in Galilee, shortly after rebuking towns that saw his miracles and refused to change.","m":"A yoke is the wooden frame that joins two oxen so they pull together. Rabbis spoke of taking on the yoke of the Law; Jesus offers his own and calls it easy."},{"b":39,"c":16,"v":26,"e":26,"t":{"bsb":"What will it profit a man if he gains the whole world, yet forfeits his soul? Or what can a man give in exchange for his soul?","kjv":"For what is a man profited, if he shall gain the whole world, and lose his own soul? or what shall a man give in exchange for his soul?"},"s":"Jesus to his disciples near Caesarea Philippi, just after telling them for the first time that he must suffer and die.","m":"Peter has rebuked him for saying so. Jesus answers with the call to take up the cross, then puts the question in the language of profit and loss."},{"b":39,"c":18,"v":20,"e":20,"t":{"bsb":"For where two or three gather together in My name, there am I with them.","kjv":"For where two or three are gathered together in my name, there am I in the midst of them."},"s":"Jesus to his disciples, in instructions on what to do when a fellow believer sins against you.","m":"The “two or three” echo the witnesses required in that process, gathered to pray over a hard decision. The promise is his presence with them as they act."},{"b":39,"c":22,"v":37,"e":39,"t":{"bsb":"Jesus declared, “‘Love the Lord your God with all your heart and with all your soul and with all your mind.’ This is the first and greatest commandment. And the second is like it: ‘Love your neighbor as yourself.’”","kjv":"Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind. This is the first and great commandment. And the second is like unto it, Thou shalt love thy neighbour as thyself."},"s":"Jesus in the temple courts during his final week, answering a legal expert’s test question about the greatest commandment.","m":"He joins two Old Testament texts, Deuteronomy 6:5 and Leviticus 19:18. He adds that all the Law and the Prophets hang on these two."},{"b":39,"c":28,"v":19,"e":20,"t":{"bsb":"Therefore go and make disciples of all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit, and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.","kjv":"Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost: Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, even unto the end of the world. Amen."},"s":"The risen Jesus to the eleven disciples on a mountain in Galilee. These are the last words of Matthew’s Gospel.","m":"The one command in the Greek is “make disciples” (the King James Version has “teach all nations”); baptizing and teaching describe how. Matthew opened with the name Immanuel, “God with us,” and closes with the promise “I am with you always.”"},{"b":40,"c":9,"v":24,"e":24,"t":{"bsb":"Immediately the boy’s father cried out, “I do believe; help my unbelief!”","kjv":"And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief."},"s":"A father whose son is thrown into convulsions by a spirit, speaking to Jesus after the disciples failed to help the boy.","m":"Jesus has just told him that everything is possible for one who believes. The man admits faith and doubt in the same breath, and Jesus drives the spirit out."},{"b":40,"c":10,"v":45,"e":45,"t":{"bsb":"For even the Son of Man did not come to be served, but to serve, and to give His life as a ransom for many.","kjv":"For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many."},"s":"Jesus on the road to Jerusalem, after James and John ask to sit at his right and left in his glory.","m":"The other ten are indignant, and Jesus tells them greatness among them means serving. A ransom was the price paid to free a slave or a captive."},{"b":41,"c":1,"v":37,"e":37,"t":{"bsb":"For no word from God will ever fail.","kjv":"For with God nothing shall be impossible."},"s":"The angel Gabriel to Mary in Nazareth, announcing that she will bear a son.","m":"As a sign, Gabriel tells her that her elderly relative Elizabeth is six months pregnant. The Greek can be read “no word from God will fail” or “nothing will be impossible with God,” and it echoes the question put to Abraham and Sarah: is anything too hard for the LORD?"},{"b":41,"c":2,"v":10,"e":11,"t":{"bsb":"But the angel said to them, “Do not be afraid! For behold, I bring you good news of great joy that will be for all the people: Today in the city of David a Savior has been born to you. He is Christ the Lord!”","kjv":"And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people. For unto you is born this day in the city of David a Saviour, which is Christ the Lord."},"s":"An angel to shepherds in the fields near Bethlehem on the night Jesus was born.","m":"The announcement goes first to shepherds working the night watch, and to no one in a palace. Three titles are packed into it: Savior, Christ and Lord."},{"b":41,"c":6,"v":31,"e":31,"t":{"bsb":"Do to others as you would have them do to you.","kjv":"And as ye would that men should do to you, do ye also to them likewise."},"s":"Jesus in the Sermon on the Plain, teaching a large crowd about loving their enemies.","m":"Often called the Golden Rule. Hillel and some other ancient teachers gave it in the negative, as a warning against doing to others what you would hate; Jesus states it as something to go and do."},{"b":41,"c":15,"v":20,"e":20,"t":{"bsb":"So he got up and went to his father. But while he was still in the distance, his father saw him and was filled with compassion. He ran to his son, embraced him, and kissed him.","kjv":"And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."},"s":"From Jesus’ parable of the lost son, told to religious leaders who complained that he ate with sinners.","m":"The son has wasted his inheritance and rehearsed a speech asking to be taken on as a hired hand. His father sees him from far off and runs to him before a word of it is spoken."},{"b":41,"c":23,"v":34,"e":34,"t":{"bsb":"Then Jesus said, “Father, forgive them, for they do not know what they are doing.” And they divided up His garments by casting lots.","kjv":"Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots."},"s":"Jesus on the cross at the place called the Skull, as the soldiers divide his clothes.","m":"This is traditionally counted the first of his seven sayings from the cross. Some early manuscripts of Luke lack the sentence, a fact many modern Bibles mention in a footnote."},{"b":42,"c":1,"v":1,"e":1,"t":{"bsb":"In the beginning was the Word, and the Word was with God, and the Word was God.","kjv":"In the beginning was the Word, and the Word was with God, and the Word was God."},"s":"The opening line of John’s Gospel, deliberately echoing the first words of Genesis.","m":"“Word” translates the Greek logos. John says the Word existed before creation, was with God and was God. Verse 14 says the Word became flesh, and verse 17 names him: Jesus Christ."},{"b":42,"c":1,"v":14,"e":14,"t":{"bsb":"The Word became flesh and made His dwelling among us. We have seen His glory, the glory of the one and only Son from the Father, full of grace and truth.","kjv":"And the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth."},"s":"From the prologue that introduces John’s Gospel.","m":"The verb for dwelling is literally “pitched his tent,” the language of the tabernacle where God’s glory lived among Israel in the wilderness. John is saying that the same presence has come in a human life."},{"b":42,"c":3,"v":16,"e":16,"t":{"bsb":"For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.","kjv":"For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."},"s":"From the account of Jesus’ night-time conversation with Nicodemus, a Pharisee and member of the Jewish ruling council.","m":"The verses just before recall the bronze snake Moses lifted up in the desert, so that anyone bitten who looked at it lived. The next verse adds that the Son was sent to save the world rather than condemn it."},{"b":42,"c":8,"v":32,"e":32,"t":{"bsb":"Then you will know the truth, and the truth will set you free.","kjv":"And ye shall know the truth, and the truth shall make you free."},"s":"Jesus in the temple courts in Jerusalem, speaking to people who had begun to believe him.","m":"The thought starts a verse earlier with a condition: “If you continue in my word.” His hearers object that they have never been slaves, and he answers that everyone who sins is a slave to sin."},{"b":42,"c":10,"v":10,"e":10,"t":{"bsb":"The thief comes only to steal and kill and destroy. I have come that they may have life, and have it in all its fullness.","kjv":"The thief cometh not, but for to steal, and to kill, and to destroy: I am come that they might have life, and that they might have it more abundantly."},"s":"Jesus in Jerusalem, describing himself as the gate for the sheep and the good shepherd.","m":"The thief stands for the false shepherds he has been describing, leaders who use the flock for themselves. In the next verse he says the good shepherd lays down his life for the sheep."},{"b":42,"c":11,"v":35,"e":35,"t":{"bsb":"Jesus wept.","kjv":"Jesus wept."},"s":"Jesus outside Bethany, on his way to the tomb of his friend Lazarus, with Lazarus’s sister Mary and the mourners who came with her.","m":"The shortest verse in most English Bibles. By John’s account Jesus is about to raise Lazarus, and he weeps anyway; the onlookers say, “See how he loved him.”"},{"b":42,"c":13,"v":34,"e":35,"t":{"bsb":"A new commandment I give you: Love one another. As I have loved you, so you also must love one another. By this everyone will know that you are My disciples, if you love one another.","kjv":"A new commandment I give unto you, That ye love one another; as I have loved you, that ye also love one another. By this shall all men know that ye are my disciples, if ye have love one to another."},"s":"Jesus at the Last Supper, after washing his disciples’ feet and after Judas has left the room.","m":"Loving your neighbor was already commanded in Leviticus. What is new is the standard, “as I have loved you,” spoken hours before the cross."},{"b":42,"c":14,"v":6,"e":6,"t":{"bsb":"Jesus answered, “I am the way and the truth and the life. No one comes to the Father except through Me.”","kjv":"Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."},"s":"Jesus at the Last Supper, answering Thomas, who has said they do not know where he is going or how to get there.","m":"It is one of seven “I am” sayings traditionally counted in John’s Gospel. Jesus has just said he is going to prepare a place in his Father’s house and will come back for them."},{"b":42,"c":14,"v":27,"e":27,"t":{"bsb":"Peace I leave with you; My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled; do not be afraid.","kjv":"Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid."},"s":"Jesus at the Last Supper, hours before his arrest.","m":"“Peace” was the everyday Jewish word for hello and goodbye. He gives it as a parting gift on the night his disciples will scatter."},{"b":42,"c":15,"v":13,"e":13,"t":{"bsb":"Greater love has no one than this, that he lay down his life for his friends.","kjv":"Greater love hath no man than this, that a man lay down his life for his friends."},"s":"Jesus on the night of the Last Supper, in his teaching on the vine and the branches.","m":"He has just repeated the command to love one another as he has loved them. In the next verses he calls the disciples friends instead of servants, on the night before he dies."},{"b":42,"c":16,"v":33,"e":33,"t":{"bsb":"I have told you these things so that in Me you may have peace. In the world you will have tribulation. But take courage; I have overcome the world!","kjv":"These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world."},"s":"The last line of Jesus’ farewell teaching on the night of the Last Supper, before he prays and goes out to be arrested.","m":"He has just told the disciples they will scatter and leave him alone. Trouble is promised as plainly as peace, and the confidence rests on what he has done."},{"b":42,"c":20,"v":29,"e":29,"t":{"bsb":"Jesus said to him, “Because you have seen
