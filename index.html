Me, you have believed; blessed are those who have not seen and yet have believed.”","kjv":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed."},"s":"The risen Jesus to Thomas, a week after the resurrection.","m":"Thomas had refused to believe without touching the wounds; now he answers, “My Lord and my God.” Two verses later John says this is why he wrote, so that readers who have not seen may believe."},{"b":43,"c":1,"v":8,"e":8,"t":{"bsb":"But you will receive power when the Holy Spirit comes upon you, and you will be My witnesses in Jerusalem, and in all Judea and Samaria, and to the ends of the earth.","kjv":"But ye shall receive power, after that the Holy Ghost is come upon you: and ye shall be witnesses unto me both in Jerusalem, and in all Judaea, and in Samaria, and unto the uttermost part of the earth."},"s":"The risen Jesus to his apostles on the Mount of Olives, just before he is taken up.","m":"They had asked whether he was about to restore the kingdom to Israel. His answer doubles as an outline of the book of Acts: Jerusalem, then Judea and Samaria, then the wider world."},{"b":43,"c":20,"v":35,"e":35,"t":{"bsb":"In everything, I showed you that by this kind of hard work we must help the weak, remembering the words of the Lord Jesus Himself: ‘It is more blessed to give than to receive.’","kjv":"I have shewed you all things, how that so labouring ye ought to support the weak, and to remember the words of the Lord Jesus, how he said, It is more blessed to give than to receive."},"s":"Paul’s farewell to the elders of the church at Ephesus, who have come to meet him at Miletus.","m":"Paul reminds them that he worked with his own hands to support himself and his companions. The saying he quotes from Jesus is recorded in none of the four Gospels."},{"b":44,"c":1,"v":16,"e":16,"t":{"bsb":"I am not ashamed of the gospel, because it is the power of God for salvation to everyone who believes, first to the Jew, then to the Greek.","kjv":"For I am not ashamed of the gospel of Christ: for it is the power of God unto salvation to every one that believeth; to the Jew first, and also to the Greek."},"s":"Paul’s statement of his theme near the start of his letter to the Christians in Rome, a city he had not yet visited.","m":"Rome prized power and status, and the message of a crucified Messiah had neither. Paul says the gospel is itself God’s power, and his phrase about the Jew first reflects Israel’s place in God’s plan, which was also the order in which the message spread."},{"b":44,"c":3,"v":23,"e":24,"t":{"bsb":"…for all have sinned and fall short of the glory of God, and are justified freely by His grace through the redemption that is in Christ Jesus.","kjv":"For all have sinned, and come short of the glory of God; Being justified freely by his grace through the redemption that is in Christ Jesus…"},"s":"Paul to the church in Rome, concluding an argument that Jew and Gentile alike stand guilty before God.","m":"Verse 23 is half a sentence. It runs straight on into verse 24, where being put right with God comes freely, as a gift."},{"b":44,"c":5,"v":8,"e":8,"t":{"bsb":"But God proves His love for us in this: While we were still sinners, Christ died for us.","kjv":"But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us."},"s":"Paul to the church in Rome, explaining why believers can be sure of God’s love.","m":"He grants that someone might possibly die for a good person. His proof is the timing: Christ died while people were still sinners, before any change on their part."},{"b":44,"c":6,"v":23,"e":23,"t":{"bsb":"For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.","kjv":"For the wages of sin is death; but the gift of God is eternal life through Jesus Christ our Lord."},"s":"Paul to the church in Rome, closing a chapter that compares two masters, sin and God.","m":"The contrast is between pay and a present. Sin pays out what has been earned; eternal life cannot be earned and is given."},{"b":44,"c":8,"v":1,"e":1,"t":{"bsb":"Therefore, there is now no condemnation for those who are in Christ Jesus.","kjv":"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit."},"s":"Paul to the church in Rome. Chapter 7 has just ended with his cry of wretchedness over the pull of sin.","m":"“Therefore” ties this verse to that struggle and to the whole letter so far. The chapter that opens with no condemnation ends with no separation. The King James Version adds a clause here from later manuscripts; every version has it at verse 4."},{"b":44,"c":8,"v":28,"e":28,"t":{"bsb":"And we know that God works all things together for the good of those who love Him, who are called according to His purpose.","kjv":"And we know that all things work together for good to them that love God, to them who are the called according to his purpose."},"s":"Paul to the church in Rome, in a passage about present suffering and future glory.","m":"The verse does not call everything good; the lines around it speak of hardship, persecution and famine. Verse 29 points to the good in view: being shaped into the likeness of Christ."},{"b":44,"c":8,"v":38,"e":39,"t":{"bsb":"For I am convinced that neither death nor life, neither angels nor principalities, neither the present nor the future, nor any powers, neither height nor depth, nor anything else in all creation, will be able to separate us from the love of God that is in Christ Jesus our Lord.","kjv":"For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."},"s":"The climax of Romans 8.","m":"Paul has just listed hardships, most of which he had faced himself: trouble, persecution, hunger, danger, the sword. His list here covers every direction he can think of, in time, in space and in the unseen world."},{"b":44,"c":12,"v":2,"e":2,"t":{"bsb":"Do not be conformed to this world, but be transformed by the renewing of your mind. Then you will be able to test and approve what is the good, pleasing, and perfect will of God.","kjv":"And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God."},"s":"Paul turns from eleven chapters of teaching to how the Christians in Rome should live.","m":"“Conformed” pictures being pressed into a mould from outside. “Transformed” translates the Greek word behind “metamorphosis,” and the change he describes begins with how a person thinks."},{"b":44,"c":15,"v":13,"e":13,"t":{"bsb":"Now may the God of hope fill you with all joy and peace as you believe in Him, so that you may overflow with hope by the power of the Holy Spirit.","kjv":"Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost."},"s":"A blessing Paul prays over the Roman church as he finishes the main body of his letter.","m":"It closes a section urging Jewish and Gentile believers to accept one another. Hope here means confidence about the future that rests on God’s promises."},{"b":45,"c":10,"v":13,"e":13,"t":{"bsb":"No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.","kjv":"There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it."},"s":"Paul to the church in Corinth, after recalling how Israel fell in the wilderness.","m":"The verse before warns anyone who thinks he is standing firm to be careful not to fall. The promise concerns temptation and a way through it. Paul says elsewhere that he was burdened beyond his own strength (2 Corinthians 1:8)."},{"b":45,"c":13,"v":4,"e":7,"t":{"bsb":"Love is patient, love is kind. It does not envy, it does not boast, it is not proud. It is not rude, it is not self-seeking, it is not easily angered, it keeps no account of wrongs. Love takes no pleasure in evil, but rejoices in the truth. It bears all things, believes all things, hopes all things, endures all things.","kjv":"Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up, Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil; Rejoiceth not in iniquity, but rejoiceth in the truth; Beareth all things, believeth all things, hopeth all things, endureth all things."},"s":"Paul to the church in Corinth, which was quarrelling over whose spiritual gifts mattered most.","m":"It is read at weddings, though Paul wrote it to correct a divided congregation. Several lines answer faults he has named earlier in the letter: envy, boasting, pride. Where the King James Version says “charity,” the Greek word is agape."},{"b":45,"c":16,"v":13,"e":14,"t":{"bsb":"Be on the alert. Stand firm in the faith. Be men of courage. Be strong. Do everything in love.","kjv":"Watch ye, stand fast in the faith, quit you like men, be strong. Let all your things be done with charity."},"s":"Paul’s closing instructions to the church in Corinth.","m":"Four short commands in the language of soldiers on watch are followed by a fifth that governs them all. It sums up a letter to a gifted church that kept failing at love (“charity” in the King James Version)."},{"b":46,"c":5,"v":17,"e":17,"t":{"bsb":"Therefore if anyone is in Christ, he is a new creation. The old has passed away. Behold, the new has come!","kjv":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."},"s":"Paul to the church in Corinth, explaining why he no longer measures anyone by outward standards.","m":"The Greek is abrupt: “If anyone in Christ, new creation.” The following verses say this is God’s doing, reconciling the world to himself through Christ."},{"b":46,"c":12,"v":9,"e":9,"t":{"bsb":"But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me.","kjv":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."},"s":"Paul to the church in Corinth, describing a “thorn in the flesh” he asked the Lord three times to remove.","m":"He never says what the thorn was. The request was refused, and this sentence is the answer he was given."},{"b":47,"c":2,"v":20,"e":20,"t":{"bsb":"I have been crucified with Christ, and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave Himself up for me.","kjv":"I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me."},"s":"Paul to the churches of Galatia, recounting how he confronted Peter at Antioch.","m":"Under pressure from visitors, Peter had stopped eating with Gentile believers. Paul answers that his standing with God rests on Christ and no longer on keeping the Law."},{"b":47,"c":5,"v":22,"e":23,"t":{"bsb":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control. Against such things there is no law.","kjv":"But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law."},"s":"Paul to the churches of Galatia, contrasting life by the Spirit with what the flesh produces.","m":"“Fruit” is singular, nine qualities described as one harvest. The list before it is a list of works, or acts; this one is called fruit, something that grows."},{"b":47,"c":6,"v":9,"e":9,"t":{"bsb":"Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.","kjv":"And let us not be weary in well doing: for in due season we shall reap, if we faint not."},"s":"Paul’s closing appeal to the churches of Galatia.","m":"He has just used a farming picture: a person reaps what he sows. Harvest comes in its season, and the next verse turns the picture into a task, doing good to everyone as opportunity allows."},{"b":48,"c":2,"v":8,"e":9,"t":{"bsb":"For it is by grace you have been saved through faith, and this not from yourselves; it is the gift of God, not by works, so that no one can boast.","kjv":"For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast."},"s":"Paul to the Christians in and around Ephesus, describing how God made them alive when they were spiritually dead.","m":"The next verse completes the thought. People are not saved by good works, and they are created in Christ for good works that God prepared in advance."},{"b":48,"c":4,"v":32,"e":32,"t":{"bsb":"Be kind and tenderhearted to one another, forgiving each other just as in Christ God forgave you.","kjv":"And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you."},"s":"Paul to the Ephesian church, in practical instructions about speech and anger.","m":"It closes a list of things to put away: bitterness, rage, shouting, slander. The measure for forgiving others is the way God forgave them in Christ."},{"b":49,"c":1,"v":6,"e":6,"t":{"bsb":"…being confident of this, that He who began a good work in you will carry it on to completion until the day of Christ Jesus.","kjv":"Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ…"},"s":"Paul, writing in chains, to the church at Philippi, the first he founded in Europe.","m":"He is thanking God for their partnership in the gospel from the first day. The “day” in view is the day of Christ’s return, so the work is finished on God’s timetable."},{"b":49,"c":2,"v":3,"e":4,"t":{"bsb":"Do nothing out of selfish ambition or empty pride, but in humility consider others more important than yourselves. Each of you should look not only to your own interests, but also to the interests of others.","kjv":"Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves. Look not every man on his own things, but every man also on the things of others."},"s":"Paul to the Philippians, urging a church with some friction in it to be united.","m":"These verses lead into a passage about Christ, often thought to be an early hymn, who took the form of a servant and humbled himself to death on a cross. Paul’s instruction is to share that mindset."},{"b":49,"c":4,"v":6,"e":7,"t":{"bsb":"Be anxious for nothing, but in everything, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.","kjv":"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."},"s":"Paul, a prisoner, to the Philippians.","m":"The verb translated “guard” (“keep” in the King James Version) is a military one, used of a garrison watching over a city, and Philippi was a Roman colony settled by veterans. The sentence just before says the Lord is near."},{"b":49,"c":4,"v":8,"e":8,"t":{"bsb":"Finally, brothers, whatever is true, whatever is honorable, whatever is right, whatever is pure, whatever is lovely, whatever is admirable—if anything is excellent or praiseworthy—think on these things.","kjv":"Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things."},"s":"Paul’s closing advice to the Philippians.","m":"Several words in the list were common in Greek moral teaching of the time. Paul tells them to dwell on such things and, in the next verse, to practise what they saw in him."},{"b":49,"c":4,"v":13,"e":13,"t":{"bsb":"I can do all things through Christ who gives me strength.","kjv":"I can do all things through Christ which strengtheneth me."},"s":"Paul, in prison, thanking the Philippians for a gift of money.","m":"He has just said he has learned to be content whether well fed or hungry, with plenty or with nothing. “All things” refers to that list. The strength is for enduring whatever comes."},{"b":50,"c":3,"v":23,"e":24,"t":{"bsb":"Whatever you do, work at it with your whole being, for the Lord and not for men, because you know that you will receive an inheritance from the Lord as your reward. It is the Lord Christ you are serving.","kjv":"And whatsoever ye do, do it heartily, as to the Lord, and not unto men; Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ."},"s":"Paul to the church at Colossae, in instructions for households.","m":"These words were first addressed to slaves, people with no say over their work. Paul tells them their true master is Christ, who will reward them, and then tells masters to treat them justly."},{"b":51,"c":5,"v":16,"e":18,"t":{"bsb":"Rejoice at all times. Pray without ceasing. Give thanks in every circumstance, for this is God’s will for you in Christ Jesus.","kjv":"Rejoice evermore. Pray without ceasing. In every thing give thanks: for this is the will of God in Christ Jesus concerning you."},"s":"The close of Paul’s letter to the young church in Thessalonica, among the earliest of his letters.","m":"The church was facing persecution and grieving members who had died. The wording is thanks in every circumstance, which is different from thanks for every circumstance."},{"b":53,"c":4,"v":12,"e":12,"t":{"bsb":"Let no one despise your youth, but set an example for the believers in speech, in conduct, in love, in faith, in purity.","kjv":"Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity."},"s":"Paul to Timothy, whom he had left in charge of the church at Ephesus.","m":"Timothy was young for the authority he held, and some of those he had to correct were his elders. Paul’s answer to being looked down on is to set the example himself."},{"b":53,"c":6,"v":10,"e":10,"t":{"bsb":"For the love of money is the root of all kinds of evil. By craving it, some have wandered away from the faith and pierced themselves with many sorrows.","kjv":"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced themselves through with many sorrows."},"s":"Paul to Timothy, warning about teachers who treat godliness as a way to get rich.","m":"Often shortened to “money is the root of all evil.” Paul’s target is the love of it, and most modern versions translate “all kinds of evil.”"},{"b":54,"c":1,"v":7,"e":7,"t":{"bsb":"For God has not given us a spirit of fear, but of power, love, and self-control.","kjv":"For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind."},"s":"Paul, in prison in Rome and expecting to die, to his younger co-worker Timothy.","m":"Timothy seems to have been timid, and Paul has just urged him to fan into flame the gift he was given. The next verse asks him not to be ashamed of the message or of Paul’s chains."},{"b":54,"c":3,"v":16,"e":17,"t":{"bsb":"All Scripture is God-breathed and is useful for instruction, for conviction, for correction, and for training in righteousness, so that the man of God may be complete, fully equipped for every good work.","kjv":"All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness: That the man of God may be perfect, throughly furnished unto all good works."},"s":"From Paul’s last letter, to Timothy, who had known the Scriptures since childhood.","m":"“God-breathed,” or “inspired,” translates a single Greek word, theopneustos, found only here in the New Testament. The Scriptures Timothy grew up with were what Christians now call the Old Testament."},{"b":57,"c":4,"v":12,"e":12,"t":{"bsb":"For the word of God is living and active. Sharper than any double-edged sword, it pierces even to dividing soul and spirit, joints and marrow. It judges the thoughts and intentions of the heart.","kjv":"For the word of God is quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and is a discerner of the thoughts and intents of the heart."},"s":"An anonymous letter to Jewish Christians tempted to give up. The writer has been warning them from Psalm 95 not to harden their hearts.","m":"The “word” in view is God’s spoken warning and promise, which exposes what is really in a person. The next verse says nothing in creation is hidden from his sight."},{"b":57,"c":11,"v":1,"e":1,"t":{"bsb":"Now faith is the assurance of what we hope for and the certainty of what we do not see.","kjv":"Now faith is the substance of things hoped for, the evidence of things not seen."},"s":"The opening of a chapter that surveys Old Testament men and women of faith, from Abel to the prophets.","m":"The examples that follow show faith as acting on God’s promise before seeing the result. The writer notes that many of them died without receiving what was promised."},{"b":57,"c":12,"v":11,"e":11,"t":{"bsb":"No discipline seems enjoyable at the time, but painful. Later on, however, it yields a harvest of righteousness and peace to those who have been trained by it.","kjv":"Now no chastening for the present seemeth to be joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby."},"s":"The writer of Hebrews to believers worn down by hardship.","m":"He has compared their suffering to a father training his children. The word for “trained,” or “exercised,” is the Greek behind “gymnasium,” the language of athletic practice."},{"b":57,"c":13,"v":8,"e":8,"t":{"bsb":"Jesus Christ is the same yesterday and today and forever.","kjv":"Jesus Christ the same yesterday, and to day, and for ever."},"s":"From the closing instructions of the letter to the Hebrews.","m":"It sits between a call to remember the leaders who first taught them and a warning against strange teachings. Leaders come and go, and the one they preached does not change."},{"b":58,"c":1,"v":2,"e":4,"t":{"bsb":"Consider it pure joy, my brothers, when you encounter trials of many kinds, because you know that the testing of your faith develops perseverance. Allow perseverance to finish its work, so that you may be mature and complete, not lacking anything.","kjv":"My brethren, count it all joy when ye fall into divers temptations; Knowing this, that the trying of your faith worketh patience. But let patience have her perfect work, that ye may be perfect and entire, wanting nothing."},"s":"James, a leader of the church in Jerusalem, to Jewish Christians scattered abroad.","m":"He treats trials as a test that produces endurance, and endurance as the road to maturity. The Greek word covers both “trial” and “temptation,” which is why older versions say “temptations.”"},{"b":58,"c":1,"v":5,"e":5,"t":{"bsb":"Now if any of you lacks wisdom, he should ask God, who gives generously to all without finding fault, and it will be given to him.","kjv":"If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him."},"s":"James to scattered Jewish Christians, straight after his words about trials.","m":"The wisdom in view is knowing how to live through testing. God is described as giving generously and without finding fault, and the next verse adds that the asking should be done in faith."},{"b":58,"c":1,"v":19,"e":20,"t":{"bsb":"My beloved brothers, understand this: Everyone should be quick to listen, slow to speak, and slow to anger, for man’s anger does not bring about the righteousness that God desires.","kjv":"Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: For the wrath of man worketh not the righteousness of God."},"s":"James, writing to congregations troubled by sharp tongues and quarrels.","m":"Two of the three commands are about slowing down. Speech is a main theme of the letter, and chapter 3 calls the tongue a small spark that sets a forest on fire."},{"b":58,"c":1,"v":22,"e":22,"t":{"bsb":"Be doers of the word, and not hearers only. Otherwise, you are deceiving yourselves.","kjv":"But be ye doers of the word, and not hearers only, deceiving your own selves."},"s":"James, pressing his readers to act on what they hear read aloud when they gather.","m":"He compares the hearer who does nothing to a man who looks in a mirror and at once forgets his own face. Most people then heard Scripture read aloud, and few owned a copy."},{"b":59,"c":3,"v":15,"e":15,"t":{"bsb":"But in your hearts sanctify Christ as Lord. Always be prepared to give a defense to everyone who asks you the reason for the hope that is in you. But respond with gentleness and respect…","kjv":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear…"},"s":"Peter to Christians in Asia Minor who were being slandered for their faith.","m":"The verse assumes that people will ask. The answer is to be given gently and with respect, and the surrounding verses are about suffering for doing good."},{"b":59,"c":5,"v":7,"e":7,"t":{"bsb":"Cast all your anxiety on Him, because He cares for you.","kjv":"Casting all your care upon him; for he careth for you."},"s":"From Peter’s closing instructions to churches under pressure in Asia Minor.","m":"In Greek this continues the sentence before it: humble yourselves under God’s mighty hand, casting your anxiety on him. Handing over worry is one of the ways humility is practised."},{"b":60,"c":3,"v":9,"e":9,"t":{"bsb":"The Lord is not slow in keeping His promise as some understand slowness, but is patient with you, not wanting anyone to perish but everyone to come to repentance.","kjv":"The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance."},"s":"Peter, answering scoffers who ask why Christ’s promised return has not happened.","m":"He has just said that with the Lord a day is like a thousand years. The delay, he argues, is patience that leaves time for repentance."},{"b":61,"c":1,"v":9,"e":9,"t":{"bsb":"If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.","kjv":"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness."},"s":"John to churches unsettled by false teachers, answering the claim to be without sin.","m":"The verses on either side quote that claim and reject it. Forgiveness is tied here to God’s faithfulness and justice."},{"b":61,"c":4,"v":19,"e":19,"t":{"bsb":"We love because He first loved us.","kjv":"We love him, because he first loved us."},"s":"John, in a letter that returns again and again to love.","m":"The sentence explains where love comes from. The next verse draws the test: anyone who claims to love God while hating a brother or sister is a liar. Many later manuscripts, followed by the King James Version, read “We love him.”"},{"b":64,"c":1,"v":24,"e":25,"t":{"bsb":"Now to Him who is able to keep you from stumbling and to present you unblemished in His glorious presence, with great joy—to the only God our Savior be glory, majesty, dominion, and authority through Jesus Christ our Lord before all time, and now, and for all eternity. Amen.","kjv":"Now unto him that is able to keep you from falling, and to present you faultless before the presence of his glory with exceeding joy, To the only wise God our Saviour, be glory and majesty, dominion and power, both now and ever. Amen."},"s":"The closing words of Jude’s short letter, written to warn a church about false teachers who had slipped in.","m":"After a letter full of warnings, the last word is about God’s ability to keep his people from falling. It is often spoken to close a church service."},{"b":65,"c":1,"v":8,"e":8,"t":{"bsb":"“I am the Alpha and the Omega,” says the Lord God, who is and was and is to come—the Almighty.","kjv":"I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty."},"s":"The opening of Revelation, John’s vision written down for seven churches in Asia Minor.","m":"Alpha and omega are the first and last letters of the Greek alphabet. The title is spoken again at the end of the book, in chapters 21 and 22."},{"b":65,"c":3,"v":20,"e":20,"t":{"bsb":"Behold, I stand at the door and knock. If anyone hears My voice and opens the door, I will come in and dine with him, and he with Me.","kjv":"Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me."},"s":"The risen Christ to the church in Laodicea, a wealthy city, in the last of seven letters to churches in Asia Minor.","m":"The words are addressed to a congregation that Jesus has just called lukewarm. Sharing a meal was a sign of acceptance and friendship."},{"b":65,"c":21,"v":4,"e":4,"t":{"bsb":"‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.","kjv":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."},"s":"John’s vision of a new heaven and a new earth, near the end of the Bible.","m":"A loud voice has just announced that God’s dwelling is now with humanity. The promise echoes Isaiah 25:8, where God swallows up death and wipes the tears from every face."}];

var rscroll=$('#rscroll'),chaptersEl=$('#chapters'),moreEl=$('#more'),prevBtn=$('#prevCh'),pickLabel=$('#pickLabel'),selbar=$('#selbar');
var bookP={},bookData={},rd={first:null,last:null,hl:null,busy:false,tok:0,cur:null,done:false},sel=null;
function loadBook(tr,b){
  var key=tr+':'+b;
  if(!bookP[key]){
    bookP[key]=fetch('t/'+tr+'/'+pad2(b+1)+'.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(d){bookData[key]=d;return d;},function(e){delete bookP[key];throw e;});
  }
  return bookP[key];
}
function nextOf(b,c){return c<CHAPS[b]?{b:b,c:c+1}:b<65?{b:b+1,c:1}:null;}
function prevOf(b,c){return c>1?{b:b,c:c-1}:b>0?{b:b-1,c:CHAPS[b-1]}:null;}
function chapterEl(b,c,data){
  var sec=document.createElement('section');sec.className='ch'+(POETRY[b]?' poetry':'');sec.dataset.b=b;sec.dataset.c=c;
  var h='<h2 class="ch-h">'+esc(chapText(b,c))+'</h2>',sup=data.s&&data.s[c];
  if(sup)h+='<p class="sup">'+esc(sup)+'</p>';
  h+='<p class="vv">';
  (data.c[c-1]||[]).forEach(function(t,i){
    if(!t)return;
    var v=i+1,hl=rd.hl&&rd.hl.b===b&&rd.hl.c===c&&v>=rd.hl.v&&v<=rd.hl.e;
    h+='<span class="v'+(hl?' hl':'')+'" data-v="'+v+'"><sup>'+v+'</sup>'+esc(t)+' </span>';
  });

function setCur(b,c){

function appendChapter(b,c,tk){
  rd.busy=true;moreEl.textContent='Loading '+chapText(b,c)+'…';
  return loadBook(S.tr,b).then(function(data){
    if(tk!==rd.tok)return;
    chaptersEl.appendChild(chapterEl(b,c,data));rd.last={b:b,c:c};rd.busy=false;
    var n=nextOf(b,c);
    if(!n){rd.done=true;moreEl.textContent='The end of Revelation.';}else moreEl.textContent='';
  },function(){
    if(tk!==rd.tok)return;

  if(gap<700){var n=nextOf(rd.last.b,rd.last.c);if(n){var tk=rd.tok;appendChapter(n.b,n.c,tk).then(function(){if(tk===rd.tok)maybeMore();});}}
}

/* selecting verses on the reading page */
function tidy(t){
  var out='',depth=0,i,ch;
  for(i=0;i<t.length;i++){ch=t[i];if(ch==='“')depth++;else if(ch==='”'){if(depth===0)continue;depth--;}out+=ch;}
  t=out;var opens=0;
  for(i=0;i<t.length;i++){ch=t[i];if(ch==='‘')opens++;else if(ch==='’'&&opens>0&&!/[A-Za-z]/.test(t[i+1]||''))opens--;}
  while(opens-->0)t+='’';
  while(depth-->0)t+='”';
  if(t.indexOf('‘')<0&&/[.!?,]’$/.test(t))t=t.slice(0,-1);
  if(t[0]==='“'&&t[t.length-1]==='”'&&t.split('“').length===2&&t.split('”').length===2)t=t.slice(1,-1);
  if(/^[a-z]/.test(t))t='…'+t;
  return t.replace(/[,;:—]$/,'…');
}
function selText(){
  var d=bookData[S.tr+':'+sel.b];if(!d)return '';
  var out='';
  for(var v=sel.v;v<=sel.e;v++){var t=d.c[sel.c-1][v-1];if(!t)continue;out+=(out&&!/—$/.test(out)?' ':'')+t;}
  return out;
}
function markSel(){
  var all=chaptersEl.querySelectorAll('.v.sel');for(var i=0;i<all.length;i++)all[i].classList.remove('sel');
  if(!sel){selbar.hidden=true;return;}
  var vs=sel.sec.querySelectorAll('.v');
  for(i=0;i<vs.length;i++){var n=+vs[i].dataset.v;if(n>=sel.v&&n<=sel.e)vs[i].classList.add('sel');}
  $('#selRef').textContent=refText(sel.b,sel.c,sel.v,sel.e);selbar.hidden=false;
}
function clearSel(){sel=null;markSel();}
chaptersEl.addEventListener('click',function(e){
  var sp=e.target.closest('.v');if(!sp)return;
  var sec=sp.closest('.ch'),v=+sp.dataset.v;
  if(sel&&sel.sec===sec&&v>=sel.v&&v<=sel.e){clearSel();return;}
  if(sel&&sel.sec===sec&&Math.max(v,sel.e)-Math.min(v,sel.v)<5){sel.v=Math.min(v,sel.v);sel.e=Math.max(v,sel.e);}
  else sel={b:+sec.dataset.b,c:+sec.dataset.c,v:v,e:v,sec:sec};
  markSel();
});
selbar.addEventListener('click',function(e){
  var b=e.target.closest('[data-sel]');if(!b||!sel)return;

      var cn=navigator.connection;
      if(cn&&cn.saveData)return;                   // Data Saver is on: fetch only what is asked for
      var urls=PICS.map(picURL).concat(P.map(function(p){return 'c/'+pid(p)+'.json';}));
      [S.tr].concat(Object.keys(TRS).filter(function(t){return t!==S.tr;})).forEach(function(tr){
        for(var b=1;b<=66;b++)urls.push('t/'+tr+'/'+pad2(b)+'.json');
      });
      setTimeout(function(){if(reg.active)reg.active.postMessage({type:'warm',urls:urls});},4000);
    }).catch(function(){});
  });
}

/* ---------- start: straight into a random verse ---------- */
paintTr();
readerEl.inert=true;
for(var n=0;n<4;n++)addCard();
setActive(0);
})();
</script>
